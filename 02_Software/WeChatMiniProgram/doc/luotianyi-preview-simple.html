<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛天依主题预览</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 30px;
            background: rgba(102, 204, 255, 0.1);
            border-radius: 20px;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #66ccff;
            font-size: 32px;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(102, 204, 255, 0.3);
        }
        .section h2 {
            color: #66ccff;
            margin-bottom: 20px;
        }
        .colors {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .color-box {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            padding: 10px;
            box-sizing: border-box;
        }
        .symbols {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .symbol-box {
            text-align: center;
            padding: 20px;
            background: rgba(102, 204, 255, 0.1);
            border-radius: 15px;
            min-width: 120px;
        }
        .symbol-box .icon {
            font-size: 60px;
            display: block;
            margin-bottom: 10px;
        }
        .phone {
            width: 375px;
            height: 600px;
            background: #1a1a3e;
            border-radius: 30px;
            margin: 20px auto;
            padding: 40px 20px;
            box-sizing: border-box;
            border: 5px solid #333;
            position: relative;
        }
        .phone-title {
            color: #66ccff;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .phone-input {
            width: 100%;
            padding: 15px;
            background: rgba(102, 204, 255, 0.1);
            border: 1px solid #66ccff;
            border-radius: 10px;
            color: #fff;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .phone-btn {
            width: 100%;
            padding: 15px;
            background: #0099ff;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .mascot {
            width: 100px;
            height: 100px;
            background: #fff;
            border-radius: 50%;
            margin: 0 auto 20px;
            position: relative;
        }
        .mascot::after {
            content: "🕊";
            position: absolute;
            top: -15px;
            right: -10px;
            font-size: 30px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .status-item {
            background: rgba(102, 204, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .status-value {
            color: #66ccff;
            font-size: 24px;
            font-weight: bold;
        }
        .status-label {
            color: #aaa;
            font-size: 12px;
            margin-top: 5px;
        }
        .loading {
            text-align: center;
            margin-top: 100px;
        }
        .bounce {
            font-size: 80px;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>洛天依主题视觉预览</h1>
        <p>智能骑行头盔小程序</p>
    </div>

    <div class="section">
        <h2>天依蓝色板</h2>
        <div class="colors">
            <div class="color-box" style="background: #e6f7ff;">#e6f7ff</div>
            <div class="color-box" style="background: #66ccff;">#66ccff</div>
            <div class="color-box" style="background: #0099ff;">#0099ff</div>
            <div class="color-box" style="background: #0077cc;">#0077cc</div>
            <div class="color-box" style="background: #0055aa;">#0055aa</div>
        </div>
    </div>

    <div class="section">
        <h2>碧玉绿 (碧瞳)</h2>
        <div class="colors">
            <div class="color-box" style="background: #86efac;">#86efac</div>
            <div class="color-box" style="background: #4ade80;">#4ade80</div>
            <div class="color-box" style="background: #2ecc71;">#2ecc71</div>
        </div>
    </div>

    <div class="section">
        <h2>标志性符号</h2>
        <div class="symbols">
            <div class="symbol-box">
                <span class="icon">∞</span>
                <div>环形辫</div>
            </div>
            <div class="symbol-box">
                <span class="icon">प</span>
                <div>梵文"羽"</div>
            </div>
            <div class="symbol-box">
                <span class="icon">≋</span>
                <div>水波纹</div>
            </div>
            <div class="symbol-box">
                <span class="icon">🎀</span>
                <div>中国结</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>登录页效果</h2>
        <div class="phone">
            <div class="mascot"></div>
            <div class="phone-title">欢迎使用</div>
            <input class="phone-input" placeholder="≋ 设备ID">
            <input class="phone-input" placeholder="≋ 密码">
            <button class="phone-btn">连接设备</button>
        </div>
    </div>

    <div class="section">
        <h2>骑行首页效果</h2>
        <div class="phone">
            <div class="phone-title">∞ 智能骑行头盔</div>
            <div style="background: rgba(102,204,255,0.1); height: 200px; border-radius: 15px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; color: #66ccff;">
                地图区域
            </div>
            <div style="color: #66ccff; font-size: 18px; margin-bottom: 15px;">प 骑行状态</div>
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-value">25</div>
                    <div class="status-label">km/h</div>
                </div>
                <div class="status-item">
                    <div class="status-value">12</div>
                    <div class="status-label">km</div>
                </div>
                <div class="status-item">
                    <div class="status-value">36</div>
                    <div class="status-label">°C</div>
                </div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>加载动画 (小笼包彩蛋)</h2>
        <div class="phone">
            <div class="loading">
                <div class="bounce">🥟</div>
                <div style="color: #66ccff; margin-top: 30px; font-size: 18px;">
                    加载中...
                </div>
            </div>
        </div>
    </div>
</body>
</html>
